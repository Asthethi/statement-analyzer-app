<div class="side-nav-content">
  <ul class="nav-list" [ngClass]="{'nav-list-open': sideNavStatus}">
    <li class="nav-list-item" *ngFor="let item of menuItems" (click)="navigateToPage(item.name)">
      <i class="{{item.icon}}"></i>
      <span>
        <a href="javascript:void(0);">{{ item.name }}</a>
      </span>
    </li>
  </ul>
</div>
