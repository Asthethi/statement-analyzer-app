        <div class="file-upload">
          <input type="file" id="fileInput" (change)="onFileChange($event)" accept=".txt,.pdf" class="file-input" />
        </div>

        <mat-slide-toggle [(ngModel)]="saveStatementToDb"
        (change)="onFileSaveToggle()"> Save Statement to Db ?</mat-slide-toggle>
      
      <div class="action-buttons">
        <button (click)="uploadStatementFile()" 
        [disabled] = "inputFile === undefined" 
        [style]="inputFile === undefined ? { 'cursor': 'none', 'opacity': '0.25' } : {}" >Upload</button>
        <button (click)="closeDialog()">Close</button>
      </div>
      
    </div>
  </div>
