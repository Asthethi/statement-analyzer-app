<table *ngIf="tableData.length > 0" class="table">
  <thead>
    <tr>
      <th *ngFor="let col of displayedColumns">{{ col | titlecase }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of tableData">
      <td *ngFor="let col of displayedColumns">{{ row[col] }}</td>
    </tr>
  </tbody>
</table>

<p *ngIf="tableData.length === 0" class="text-center">No data available</p>
